<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quasar AI</title>
<meta name="description" content="Quasar: chat, make pictures and find videos.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#05060d;--panel:#0d1020;--panel2:#141831;--ink:#eef1ff;--dim:#939bbd;--line:rgba(255,255,255,.1);--a:#9b7bff;--b:#3fd8ff}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:radial-gradient(900px 500px at 50% -10%,#24164a 0%,transparent 60%),radial-gradient(700px 400px at 100% 100%,#0b2a3a 0%,transparent 60%),var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);background:rgba(5,6,13,.6);backdrop-filter:blur(8px);position:sticky;top:0;z-index:5}
.logo{width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 50% 50%,#fff 0 8%,#c9b8ff 14%,#7b5cff 35%,transparent 62%),conic-gradient(from 0deg,transparent,#3fd8ff55,transparent,#9b7bff55,transparent);box-shadow:0 0 22px #7b5cff99;animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-family:'Oxanium',sans-serif;font-size:22px;letter-spacing:.18em;margin:0;background:linear-gradient(90deg,#c9b8ff,#3fd8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hsp{flex:1}.hbtn{font:500 13px 'IBM Plex Mono',monospace;color:var(--ink);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:99px;padding:7px 12px;text-decoration:none;cursor:pointer}.hbtn:hover{border-color:var(--a)}
main{flex:1;overflow:auto;padding:20px 16px 8px}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.hero{text-align:center;padding:40px 10px 10px}.hero .big{width:84px;height:84px;margin:0 auto 18px}.hero h2{font-family:'Oxanium',sans-serif;font-size:30px;margin:0 0 8px}.hero p{color:var(--dim);margin:0 0 22px}
.sugg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;text-align:left}.sugg button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;line-height:1.35}.sugg button:hover{border-color:var(--a);background:var(--panel2)}.sugg small{display:block;color:var(--dim);font-size:12.5px;margin-top:3px}
.msg{display:flex;gap:10px;align-items:flex-start}.msg.me{justify-content:flex-end}
.av{width:30px;height:30px;flex:0 0 30px;border-radius:50%}.msg.ai .av{background:radial-gradient(circle,#fff 0 9%,#b9a6ff 16%,#7b5cff 40%,transparent 70%)}
.bub{max-width:min(640px,86%);padding:11px 14px;border-radius:16px;line-height:1.55;font-size:15.5px;overflow-wrap:anywhere}
.me .bub{background:linear-gradient(135deg,#5b3fd6,#3a62d8);border-bottom-right-radius:4px}
.ai .bub{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.bub p{margin:.35em 0}.bub p:first-child{margin-top:0}.bub p:last-child{margin-bottom:0}.bub ul,.bub ol{margin:.4em 0;padding-left:1.3em}.bub a{color:#8fe3ff}
.bub code{font-family:'IBM Plex Mono',monospace;font-size:.9em;background:rgba(255,255,255,.08);padding:1px 5px;border-radius:5px}.bub pre{background:#05070f;border:1px solid var(--line);border-radius:10px;padding:10px;overflow:auto}.bub pre code{background:none;padding:0}
.bub h3,.bub h4{margin:.6em 0 .3em;font-family:'Oxanium',sans-serif}
.media{margin-top:10px;display:grid;gap:10px}
.pic{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(110deg,#11152a 30%,#1d2346 50%,#11152a 70%);background-size:200% 100%;animation:sh 1.4s linear infinite;aspect-ratio:4/3}
.pic.done{animation:none;background:#000;aspect-ratio:auto}.pic img{display:block;width:100%;height:auto;opacity:0;transition:opacity .4s}.pic.done img{opacity:1}
.pic .cap{position:absolute;inset:auto 0 0 0;padding:8px 10px;font-size:12.5px;color:#dfe3ff;background:linear-gradient(transparent,rgba(0,0,0,.75))}
.pic .wait{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);font:500 13px 'IBM Plex Mono',monospace}
@keyframes sh{to{background-position:-200% 0}}
.acts{display:flex;gap:6px;flex-wrap:wrap}.acts button,.acts a{font:500 12.5px 'IBM Plex Mono',monospace;color:var(--ink);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:99px;padding:5px 10px;cursor:pointer;text-decoration:none}.acts button:hover,.acts a:hover{border-color:var(--b)}
.vid{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#000}.vid video{display:block;width:100%;max-height:380px;background:#000}.vid .vt{padding:7px 10px;font-size:12.5px;color:var(--dim);background:var(--panel)}.vid .vt a{color:#8fe3ff}
.dots{display:inline-flex;gap:4px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--a);animation:bl 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}
.err{color:#ff9d9d}
footer{padding:10px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:rgba(5,6,13,.75);backdrop-filter:blur(8px)}
.bar{max-width:820px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:8px}
.bar:focus-within{border-color:var(--a)}
.mode{display:flex;gap:4px}.mode button{width:38px;height:38px;border-radius:12px;border:1px solid transparent;background:rgba(255,255,255,.04);color:var(--ink);font-size:18px;cursor:pointer}.mode button[aria-pressed="true"]{border-color:var(--b);background:rgba(63,216,255,.14)}
textarea{flex:1;resize:none;border:0;outline:0;background:transparent;color:var(--ink);font:16px 'IBM Plex Sans',system-ui,sans-serif;max-height:160px;min-height:38px;padding:8px 6px;line-height:1.4}
.send{width:42px;height:38px;border-radius:12px;border:0;cursor:pointer;color:#fff;font-size:18px;background:linear-gradient(135deg,#7b5cff,#2fb7e6)}.send:disabled{opacity:.5;cursor:default}
.hint{max-width:820px;margin:6px auto 0;color:var(--dim);font-size:12px;text-align:center}
@media (max-width:560px){header{padding:10px 12px}h1{font-size:18px}.hbtn.wide{display:none}.bub{max-width:90%;font-size:15px}.hero{padding-top:20px}.hero h2{font-size:24px}}
</style></head>
<body>
<header><div class="logo" aria-hidden="true"></div><h1>QUASAR</h1><span class="hsp"></span>
<button class="hbtn" id="newChat" title="Start a new chat">＋ New chat</button>
<a class="hbtn wide" href="https://jacob711-oss.github.io/Simulators/simulations/">🗂️ Simulators</a></header>
<main id="main"><div class="wrap" id="log">
<div class="hero" id="hero"><div class="logo big"></div><h2>Hi, I'm Quasar ✨</h2><p>Ask me anything, ask me to draw a picture, or ask to see a video.</p>
<div class="sugg">
<button data-q="Draw a dragon flying over a neon city at night" data-m="image">🎨 Draw a dragon over a neon city<small>Make a picture</small></button>
<button data-q="volcano eruption" data-m="video">🎬 Show me a video of a volcano<small>Find a real video</small></button>
<button data-q="How do black holes work? Explain it simply.">🕳️ How do black holes work?<small>Ask a question</small></button>
<button data-q="Which of your simulators should I try first, and why?">🧪 Which simulator should I try?<small>Get a recommendation</small></button>
</div></div>
</div></main>
<footer><form class="bar" id="bar"><div class="mode" role="group" aria-label="What should Quasar do?">
<button type="button" data-mode="chat" aria-pressed="true" title="Chat">💬</button><button type="button" data-mode="image" aria-pressed="false" title="Make a picture">🎨</button><button type="button" data-mode="video" aria-pressed="false" title="Find a video">🎬</button></div>
<textarea id="inp" rows="1" placeholder="Message Quasar…" aria-label="Message"></textarea><button class="send" id="send" type="submit" aria-label="Send">➤</button></form>
<div class="hint">Quasar can make mistakes. Pictures are made by AI; videos come from Wikimedia Commons.</div></footer>
<script>
(()=>{
const SIMS=[["Barycenter","space, gravity, planets and black holes","https://jacob711-oss.github.io/Simulators/barycenter/"],["Biosphere","a living world of animals, plants and microbes","https://jacob711-oss.github.io/Simulators/life/"],["Lithosphere","continents, mountains and volcanoes","https://jacob711-oss.github.io/Simulators/lithosphere/"],["Troposphere","weather, winds and hurricanes","https://jacob711-oss.github.io/Simulators/troposphere/"],["Catalyst","atoms, molecules and chemical reactions","https://jacob711-oss.github.io/Simulators/catalyst/"],["Abyssal","the ocean, from reefs to the deep sea","https://jacob711-oss.github.io/Simulators/abyssal/"],["Interchange","trains, metros and trams in a growing city","https://jacob711-oss.github.io/Simulators/interchange/"],["Gridlock","roads, buses and traffic","https://jacob711-oss.github.io/Simulators/gridlock/"],["Hivemind","ant colonies, scent trails and raids","https://jacob711-oss.github.io/Simulators/hivemind/"],["Flux","electric charges and magnets","https://jacob711-oss.github.io/Simulators/flux/"],["Seaway","ships and island ports","https://jacob711-oss.github.io/Simulators/seaway/"],["Contrail","air traffic control and airports","https://jacob711-oss.github.io/Simulators/contrail/"]];
const SYSTEM=`You are Quasar, a friendly, upbeat AI assistant on the Simulators website. You are safe for all ages: refuse anything harmful, hateful, sexual or violent in a kind way. Answer clearly and fairly briefly, using Markdown (short paragraphs, bullet lists, **bold**) when it helps.
You can make pictures and show videos. When the user wants a picture, drawing or image, write one short friendly sentence and then, on its own line, [IMAGE: a detailed English description of the picture]. When the user wants to watch or see a video, write one short sentence and then, on its own line, [VIDEO: two to four search words]. Only add these tags when the user asks for a picture or a video.
This website has these simulators, which you can recommend with Markdown links when they fit: ${SIMS.map(s=>`${s[0]} (${s[1]}): ${s[2]}`).join('; ')}.`;
const $=id=>document.getElementById(id),log=$('log'),main=$('main'),inp=$('inp'),bar=$('bar'),sendB=$('send');
let mode='chat',busy=false,hist=[];
try{hist=JSON.parse(localStorage.getItem('quasar_chat')||'[]')||[]}catch(e){hist=[]}
const save=()=>{try{localStorage.setItem('quasar_chat',JSON.stringify(hist.slice(-40)))}catch(e){}};
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function md(src){const blocks=[];let s=esc(src).replace(/```[a-z]*\n?([\s\S]*?)```/g,(_,c)=>{blocks.push(c);return`\u0000${blocks.length-1}\u0000`});
  s=s.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>')
   .replace(/\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)/g,(_,t,u)=>`<a href="${u}" target="_blank" rel="noopener">${t}</a>`);
  const out=[];let list=null;for(const line of s.split('\n')){const ul=line.match(/^\s*[-*•]\s+(.*)/),ol=line.match(/^\s*\d+[.)]\s+(.*)/),h=line.match(/^#{1,4}\s+(.*)/);
    if(ul||ol){const t=ul?'ul':'ol';if(!list||list.t!==t){if(list)out.push(`</${list.t}>`);list={t};out.push(`<${t}>`)}out.push(`<li>${(ul||ol)[1]}</li>`);continue}
    if(list){out.push(`</${list.t}>`);list=null}if(h){out.push(`<h4>${h[1]}</h4>`);continue}if(line.trim())out.push(`<p>${line}</p>`)}if(list)out.push(`</${list.t}>`);
  return out.join('').replace(/\u0000(\d+)\u0000/g,(_,i)=>`<pre><code>${blocks[+i]}</code></pre>`)}
function addMsg(who,html){$('hero')&&($('hero').hidden=true);const m=document.createElement('div');m.className='msg '+who;m.innerHTML=(who==='ai'?'<div class="av"></div>':'')+'<div class="bub"></div>';m.querySelector('.bub').innerHTML=html;log.appendChild(m);main.scrollTop=main.scrollHeight;return m.querySelector('.bub')}
const scroll=()=>{main.scrollTop=main.scrollHeight};
/* ---------- pictures ---------- */
function picture(box,prompt,seed){seed=seed||Math.floor(Math.random()*1e9);const url=`https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=1024&height=768&nologo=true&safe=true&seed=${seed}`;
  const w=document.createElement('div');w.innerHTML=`<div class="pic"><div class="wait">Painting your picture…</div><img alt=""><div class="cap"></div></div><div class="acts"><button data-a="again">🔁 Another version</button><a target="_blank" rel="noopener">⬇ Open full size</a></div>`;
  const pic=w.querySelector('.pic'),img=w.querySelector('img');img.alt=prompt;w.querySelector('.cap').textContent='🎨 '+prompt;w.querySelector('a').href=url;
  img.onload=()=>{pic.classList.add('done');pic.querySelector('.wait').remove();scroll()};img.onerror=()=>{pic.querySelector('.wait').textContent='Could not make that picture right now. Try again in a moment.';pic.style.animation='none'};img.src=url;
  w.querySelector('[data-a=again]').onclick=()=>{const b=addMsg('ai','');b.innerHTML='<p>Here is another version:</p>';const m=document.createElement('div');m.className='media';b.appendChild(m);picture(m,prompt);hist.push({role:'assistant',content:'Here is another version.',img:prompt});save()};
  box.appendChild(w);return url}
/* ---------- videos: real, free videos from Wikimedia Commons ---------- */
async function videos(box,q){const w=document.createElement('div');w.innerHTML='<div class="dots"><i></i><i></i><i></i></div>';box.appendChild(w);
  try{const u='https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=6&prop=imageinfo&iiprop=url|mime&gsrsearch='+encodeURIComponent('filetype:video '+q);
    const r=await fetch(u);const j=await r.json();const pages=Object.values((j.query&&j.query.pages)||{}).filter(p=>p.imageinfo&&/^video\//.test(p.imageinfo[0].mime)).sort((a,b)=>a.index-b.index).slice(0,2);w.innerHTML='';
    if(!pages.length){w.innerHTML=`<p>I couldn't find a free video of that. <a target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodeURIComponent(q)}">Search YouTube for “${esc(q)}”</a></p>`;return}
    for(const p of pages){const v=document.createElement('div');v.className='vid';const title=p.title.replace(/^File:/,'').replace(/\.[a-z0-9]+$/i,'').replace(/_/g,' ');
      v.innerHTML=`<video controls preload="metadata" playsinline></video><div class="vt">🎬 <span></span> · <a target="_blank" rel="noopener">Wikimedia Commons</a></div>`;v.querySelector('video').src=p.imageinfo[0].url;v.querySelector('span').textContent=title;v.querySelector('a').href=p.imageinfo[0].descriptionurl||('https://commons.wikimedia.org/wiki/'+encodeURIComponent(p.title));w.appendChild(v)}
    const more=document.createElement('div');more.className='acts';more.innerHTML=`<a target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodeURIComponent(q)}">▶ More on YouTube</a>`;w.appendChild(more);scroll()}
  catch(e){w.innerHTML=`<p class="err">Could not load videos right now.</p><div class="acts"><a target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodeURIComponent(q)}">▶ Search YouTube instead</a></div>`}}
/* ---------- chat ---------- */
async function askAI(){const msgs=[{role:'system',content:SYSTEM},...hist.slice(-12).map(m=>({role:m.role,content:m.content}))];
  try{const r=await fetch('https://text.pollinations.ai/openai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'openai',messages:msgs,private:true})});
    if(r.ok){const j=await r.json();const t=j&&j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;if(t)return t}}catch(e){}
  // simpler backup route
  const last=hist[hist.length-1].content;const r=await fetch('https://text.pollinations.ai/'+encodeURIComponent(last)+'?private=true&model=openai&system='+encodeURIComponent(SYSTEM));if(!r.ok)throw new Error(r.status);return await r.text()}
function show(text,b){let img=null,vid=null;const clean=text.replace(/\[IMAGE:\s*([^\]]+)\]/i,(_,p)=>{img=p.trim();return''}).replace(/\[VIDEO:\s*([^\]]+)\]/i,(_,q)=>{vid=q.trim();return''}).trim();
  b.innerHTML=md(clean||(img?'Here you go!':vid?'Here are some videos:':''));if(img||vid){const m=document.createElement('div');m.className='media';b.appendChild(m);if(img)picture(m,img);if(vid)videos(m,vid)}scroll();return{clean,img,vid}}
const wantsImage=t=>/^(please\s+)?(draw|paint|sketch|illustrate)\b/i.test(t)||/\b(make|generate|create|show)\b.{0,25}\b(image|picture|pic|drawing|painting|art|wallpaper|photo)\b/i.test(t);
const wantsVideo=t=>/\b(video|vid|vids|clip|footage)\b/i.test(t);
async function send(text,forced){text=text.trim();if(!text||busy)return;busy=true;sendB.disabled=true;addMsg('me',md(text));hist.push({role:'user',content:text});save();
  const m=forced||(mode!=='chat'?mode:wantsImage(text)?'image':wantsVideo(text)?'video':'chat');const b=addMsg('ai','<div class="dots"><i></i><i></i><i></i></div>');
  try{if(m==='image'){const p=text.replace(/^(please\s+)?(draw|paint|sketch|illustrate|make|generate|create)\s+(me\s+)?(a\s+|an\s+)?(picture|image|drawing|painting|pic)?\s*(of\s+)?/i,'')||text;show(`Here is your picture! [IMAGE: ${p}]`,b);hist.push({role:'assistant',content:'Here is your picture.',img:p})}
    else if(m==='video'){const q=text.replace(/\b(show|find|give|play)\b|\bme\b|\b(a|an|some|the)\b|\b(video|videos|vid|vids|clip|clips)\b|\b(of|about|on)\b|[?!.]/gi,' ').replace(/\s+/g,' ').trim()||text;show(`Here are some videos of **${q}**: [VIDEO: ${q}]`,b);hist.push({role:'assistant',content:`Here are some videos of ${q}.`,vid:q})}
    else{const t=await askAI();const r=show(t,b);hist.push({role:'assistant',content:r.clean||t,img:r.img||undefined,vid:r.vid||undefined})}}
  catch(e){b.innerHTML='<p class="err">Quasar is busy right now. Please try again in a few seconds.</p>';hist.pop()}
  save();busy=false;sendB.disabled=false;inp.focus()}
// restore the last chat
for(const h of hist){if(h.role==='user')addMsg('me',md(h.content));else{const b=addMsg('ai',md(h.content));if(h.img||h.vid){const m=document.createElement('div');m.className='media';b.appendChild(m);if(h.img)picture(m,h.img);if(h.vid)videos(m,h.vid)}}}
bar.onsubmit=e=>{e.preventDefault();const t=inp.value;inp.value='';inp.style.height='';send(t)};
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();bar.requestSubmit()}});
inp.addEventListener('input',()=>{inp.style.height='auto';inp.style.height=Math.min(160,inp.scrollHeight)+'px'});
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',x===b));inp.placeholder={chat:'Message Quasar…',image:'Describe a picture to make…',video:'What video do you want to see?'}[mode];inp.focus()});
document.querySelectorAll('.sugg button').forEach(b=>b.onclick=()=>send(b.dataset.q,b.dataset.m));
$('newChat').onclick=()=>{hist=[];save();log.querySelectorAll('.msg').forEach(m=>m.remove());$('hero').hidden=false};
})();
</script>
<script id="noemoji">/* ===== no emoji: strips emoji from every label, button, message and canvas label; emoji-only buttons get a word ===== */
(function(){
  if(window.__noEmoji)return;window.__noEmoji=true;
  const RE=/(?:\p{Extended_Pictographic}|\p{Regional_Indicator})(?:️|⃣)?(?:‍(?:\p{Extended_Pictographic})(?:️)?)*|️|‍|[\u{1F3FB}-\u{1F3FF}]/gu,HAS=/\p{Extended_Pictographic}|\p{Regional_Indicator}/u;
  const KEEP=new Set([...'★☆✓✔✗✕✖×→←↑↓↔⤢⊗⊙▸◂−±°©®™']);
  const strip=s=>s.replace(RE,m=>KEEP.has(m)?m:'').replace(/ {2,}/g,' ');
  window.noEmoji=strip;
  const short=t=>(t||'').split(/[:(.,—]/)[0].trim().slice(0,22);
  function fixBtn(b){if(!b||!(b.tagName==='BUTTON'||b.tagName==='A'||b.tagName==='SUMMARY'))return;const t=b.textContent.trim();if(t&&!/^[\d∞\s.,]+$/.test(t))return;
    const lab=short(b.getAttribute('title')||b.getAttribute('aria-label'));if(!lab)return;const n=document.createElement('span');n.className='ne-lab';n.textContent=lab+(t?' ':'');b.insertBefore(n,b.firstChild)}
  function clean(root){if(!root)return;if(root.nodeType===3){if(HAS.test(root.nodeValue)){const v=strip(root.nodeValue);root.nodeValue=/^\s/.test(root.nodeValue)?v:v.replace(/^\s+/,'');const b=root.parentElement&&root.parentElement.closest('button,a,summary');if(b)fixBtn(b)}return}
    if(root.nodeType!==1)return;if(root.tagName==='SCRIPT'||root.tagName==='STYLE'||root.tagName==='TEXTAREA')return;
    for(const a of ['title','aria-label','placeholder','alt'])if(root.hasAttribute&&root.hasAttribute(a)&&HAS.test(root.getAttribute(a)))root.setAttribute(a,strip(root.getAttribute(a)).trim());
    const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT);let n,touched=new Set();
    while((n=w.nextNode())){if(n.nodeType===1){if(n.tagName==='SCRIPT'||n.tagName==='STYLE'||n.tagName==='TEXTAREA')continue;for(const a of ['title','aria-label','placeholder','alt'])if(n.hasAttribute(a)&&HAS.test(n.getAttribute(a)))n.setAttribute(a,strip(n.getAttribute(a)).trim());continue}
      if(HAS.test(n.nodeValue)){n.nodeValue=strip(n.nodeValue).replace(/^\s+(?=\S)/,m=>n.previousSibling?' ':'');const b=n.parentElement&&n.parentElement.closest('button,a,summary');if(b)touched.add(b)}}
    for(const b of touched)fixBtn(b);root.querySelectorAll&&root.querySelectorAll('button,a,summary').forEach(b=>{if(!b.textContent.trim())fixBtn(b)})}
  // canvas labels too
  for(const P of [window.CanvasRenderingContext2D&&CanvasRenderingContext2D.prototype,window.OffscreenCanvasRenderingContext2D&&OffscreenCanvasRenderingContext2D.prototype])if(P)for(const f of ['fillText','strokeText']){const o=P[f];P[f]=function(t,...a){if(typeof t==='string'&&HAS.test(t)){t=strip(t).trim();if(!t)return}return o.call(this,t,...a)}}
  const css=document.createElement('style');css.textContent='.ico:empty,.si:empty,.ic:empty{display:none!important}.ne-lab{font-size:12px;font-weight:600;letter-spacing:.02em}';
  const go=()=>{document.head.appendChild(css);document.title=strip(document.title).trim();clean(document.body);
    new MutationObserver(ms=>{for(const m of ms){if(m.type==='characterData')clean(m.target);else for(const n of m.addedNodes)clean(n);if(m.type==='attributes')clean(m.target)}}).observe(document.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['title','aria-label','placeholder']})};
  if(document.body)go();else document.addEventListener('DOMContentLoaded',go);
})();
</script>
